    <text class="cls-18" transform="translate(561.57 66.8)"><tspan x="0" y="0">우수한 인재들이 뿌리산업 분야에</tspan><tspan x="-30.75" y="24.9">활발히 유입될 수 있도록 숙련인력 양성과</tspan><tspan x="14.87" y="49.79" xml:space="preserve"> 쾌적한 근로환경을 조성하여 </tspan><tspan x="36.98" y="74.69">경영역량을 높혀가는 것</tspan></text>
